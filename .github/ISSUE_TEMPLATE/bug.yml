name: 反馈 Bug
description: 工具结果不对、页面显示异常或功能无法使用
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: 哪个工具
      options:
        - 首页
        - 文本转二维码
        - JSON 格式化
        - Base64 / URL 编解码
        - 时间戳转换
        - 哈希计算
        - 随机密码
        - 颜色转换 / 取色
        - 图片转 Base64
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 输入了什么、点了什么。请不要粘贴密码、密钥等敏感内容。
      placeholder: |
        1. 打开 JSON 格式化
        2. 粘贴 ……
        3. 点击「格式化」
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果与实际结果
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 浏览器与系统
      placeholder: 例如：Chrome 130 / Windows 11，Safari / iOS 18
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截图（可选）
