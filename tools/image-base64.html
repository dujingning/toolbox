<script>

const TB = (() => {

  const applyTheme = m => { if (m === "light" || m === "dark") root.dataset.theme = m; else delete root.dataset.theme; };
  applyTheme(store.get("theme", "auto")); // 尽早设置，避免闪烁

  const I = {
    box: '<path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3M4 13h16"/>',
    qrcode: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM21 14v.01M14 21h.01M17.5 21H21v-3.5"/>',

    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    hash: '<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    droplet: '<path d="M12 3s6 6.2 6 11a6 6 0 0 1-12 0c0-4.8 6-11 6-11z"/>',
    image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',
    copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',

    check: '<path d="m5 12 5 5 9-10"/>',
    alert: '<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    arrow: '<path d="M5 12h14m-5-5 5 5-5 5"/>',
    pick: '<path d="m15 6 3 3M4 20l1.5-4.5L14 7a2.1 2.1 0 0 1 3 3l-8.5 8.5z"/>',
    dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h.01M15 15h.01M15 9h.01M9 15h.01"/>',
    file: '<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
    auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  };
  const TOOLS = [
    { id: "qrcode", name: "文本转二维码", short: "二维码", icon: I.qrcode, desc: "支持中文与 emoji，可调纠错、尺寸与颜色，导出 PNG / SVG", keys: "二维码 qr qrcode 文本 链接 生成" },
    { id: "json", name: "JSON 格式化", short: "JSON", icon: I.json, desc: "美化、压缩、转义，实时校验并定位错误行列", keys: "json 格式化 校验 压缩 美化 转义" },
    { id: "base64-url", name: "Base64 / URL 编解码", short: "编解码", icon: I.codec, desc: "实时转换，UTF-8 安全，支持 URL-safe、文件与二进制结果", keys: "base64 url 编码 解码 encode decode" },
    { id: "timestamp", name: "时间戳转换", short: "时间戳", icon: I.clock, desc: "时间戳与日期互转，自动识别秒 / 毫秒 / 微秒", keys: "时间戳 timestamp unix 日期 时间 时区" },
    { id: "hash", name: "哈希计算", short: "哈希", icon: I.hash, desc: "MD5、SHA-1 / 256 / 384 / 512，支持文本和文件，可比对校验值", keys: "哈希 hash md5 sha sha1 sha256 校验 摘要 文件" },
    { id: "password", name: "随机密码", short: "密码", icon: I.lock, desc: "加密安全的随机密码，强度提示，可批量生成", keys: "密码 password 随机 生成 强度" },

    { id: "image-base64", name: "图片转 Base64", short: "图片 Base64", icon: I.image, desc: "图片与 Data URI 互转，可压缩、转格式、缩放", keys: "图片 image base64 data uri 压缩 转换 图片转" },
  ].map(t => ({ ...t, href: `tools/${t.id}.html` }));

  const svg = (p, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  const isDesktop = () => matchMedia("(hover: hover) and (pointer: fine)").matches;
  const isNarrow = () => matchMedia("(max-width: 760px)").matches;
  const fmtSize = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB";

  let wrap;
  function toast(msg, type = "ok", ms = 1800) {
    if (!wrap) {
      wrap = document.createElement("div"); wrap.className = "toast-wrap";
      wrap.setAttribute("role", "status"); wrap.setAttribute("aria-live", "polite"); document.body.appendChild(wrap);
    }
    const t = document.createElement("div"); t.className = "toast " + type;
    t.innerHTML = svg(type === "err" ? I.alert : I.check) + "<span></span>"; t.lastChild.textContent = msg;
    wrap.appendChild(t);
    while (wrap.children.length > 3) wrap.firstChild.remove();
    setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 250); }, ms);
  }
  async function copy(text, label = "已复制到剪贴板") {
    if (text == null || text === "") { toast("没有可复制的内容", "err"); return false; }
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;opacity:0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
      if (!ok) { toast("复制失败，请手动选择后复制", "err"); return false; }
    }
    toast(label); return true;
  }
  function download(data, name, type) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: type || "application/octet-stream" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  // 输入内容自动保存在本机浏览器，刷新不丢
  function persist(el, key) {
    const v = store.get(key);
    if (v !== undefined) { if (el.type === "checkbox") el.checked = v; else el.value = v; }
    const save = debounce(() => store.set(key, el.type === "checkbox" ? el.checked : el.value), 300);
    el.addEventListener("input", save); el.addEventListener("change", save);
  }
  // 分段选择控件：<div class="seg" data-value="默认"><button data-v="a">…</button></div>
  function seg(el, onChange, key) {
    const btns = [...el.querySelectorAll("button[data-v]")];
    const api = {
      value: null,
      set(v, silent) {
        if (!btns.some(b => b.dataset.v === v)) v = btns[0].dataset.v;
        api.value = v;
        btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
        if (key) store.set(key, v);
        if (!silent && onChange) onChange(v);
      },
    };
    btns.forEach(b => { b.type = "button"; b.addEventListener("click", () => api.set(b.dataset.v)); });
    api.set(key ? store.get(key, el.dataset.value) : el.dataset.value, true);
    return api;
  }
  // 拖放 / 点击 / 粘贴 选择文件
  function fileDrop(el, input, onFiles, { paste = true } = {}) {
    el.addEventListener("click", () => input.click());
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    input.addEventListener("change", () => { if (input.files.length) onFiles([...input.files]); input.value = ""; });
    ["dragenter", "dragover"].forEach(t => el.addEventListener(t, e => { e.preventDefault(); el.classList.add("over"); }));
    ["dragleave", "drop"].forEach(t => el.addEventListener(t, () => el.classList.remove("over")));
    el.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
    if (paste) document.addEventListener("paste", e => {
      if (typeof paste === "function" && !paste()) return;
      const fs = [...(e.clipboardData?.items || [])].filter(i => i.kind === "file").map(i => i.getAsFile()).filter(Boolean);
      if (fs.length) { e.preventDefault(); onFiles(fs); }
    });
  }

  const THEMES = { auto: ["跟随系统", I.auto], light: ["浅色", I.sun], dark: ["深色", I.moon] };
  function buildHeader() {
    const h = document.getElementById("tb-header"); if (!h) return;
    const cur = root.dataset.tool, base = root.dataset.root || "";
    const nav = cur
      ? `<nav class="toolnav" aria-label="切换工具">${TOOLS.map(t => `<a href="${base}${t.href}"${t.id === cur ? ' aria-current="page"' : ""}>${svg(t.icon)}<span>${t.short}</span></a>`).join("")}</nav>`
      : '<div class="spacer"></div>';
    h.innerHTML = `<a class="brand" href="${base}index.html" aria-label="返回工具集首页"><span class="logo">${svg(I.box)}</span><span class="brand-text">工具集</span></a>${nav}<button class="btn btn-ghost btn-icon" id="tb-theme" type="button"></button>`;
    const btn = h.querySelector("#tb-theme");
    const paint = () => { const m = store.get("theme", "auto"), [n, ic] = THEMES[m] || THEMES.auto; btn.innerHTML = svg(ic); btn.title = btn.ariaLabel = `主题：${n}（点击切换）`; };
    btn.onclick = () => { const order = ["auto", "light", "dark"], m = order[(order.indexOf(store.get("theme", "auto")) + 1) % 3]; store.set("theme", m); applyTheme(m); paint(); toast("主题：" + THEMES[m][0]); };
    paint();
    const a = h.querySelector("[aria-current]"), n = h.querySelector(".toolnav");
    if (a && n) n.scrollLeft = a.offsetLeft - n.clientWidth / 2 + a.offsetWidth / 2;
  }
  function favicon() {
    const t = TOOLS.find(x => x.id === root.dataset.tool), p = t ? t.icon : I.box;
    const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2563eb"/><g transform="translate(5 5) scale(.917)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${p.replace(/currentColor/g, "#fff")}</g></svg>`;
    const l = document.createElement("link"); l.rel = "icon"; l.href = "data:image/svg+xml," + encodeURIComponent(s); document.head.appendChild(l);
  }
  favicon();
  document.addEventListener("DOMContentLoaded", () => {
    buildHeader();
    const af = document.querySelector("[data-autofocus]");
    if (af && isDesktop()) af.focus({ preventScroll: true }); // 手机上不自动弹出键盘
  });

  return { TOOLS, I, svg, esc, debounce, isDesktop, isNarrow, fmtSize, store, toast, copy, download, persist, seg, fileDrop };
})();
/* @shared-js:end */
</script>
</head>
<body>
<header id="tb-header" class="topbar"></header>
<main class="container">
  <div class="page-head">
    <h1>图片转 Base64</h1>
    <p>图片只在本地处理，可批量转换，也可以压缩体积或转换格式。</p>
  </div>
  <div class="seg tabs" id="tab" data-value="enc" role="group" aria-label="功能"><button data-v="enc">图片 → Base64</button><button data-v="dec">Base64 → 图片</button></div>

  <div id="enc">
    <section class="card">
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="选择图片"></div>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <div class="opts">
        <label class="field"><span class="label">输出格式</span>
          <select id="fmt"><option value="orig">保持原格式</option><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select></label>
        <label class="field"><span class="label">质量（JPEG / WebP）</span><input type="number" id="q" value="85" min="10" max="100"></label>
        <label class="field"><span class="label">最大宽度（px）</span><input type="number" id="maxW" placeholder="不限" min="1"></label>
        <button class="btn btn-ghost" id="clearAll" type="button" hidden>清空全部</button>
      </div>
      <p class="small muted" style="margin:12px 0 0" id="fmtTip"></p>
    </section>
    <div id="list"></div>
  </div>

  <div id="dec" hidden>
    <section class="card">
      <textarea id="decIn" class="mono" style="height:180px" placeholder="粘贴 data:image/...;base64,... 或纯 Base64 字符串，自动预览" spellcheck="false" aria-label="Base64 内容"></textarea>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-primary" id="decDl" type="button" disabled></button>
        <span class="status" id="decInfo" aria-live="polite"></span>
      </div>
      <div class="decwrap checker" id="decWrap" hidden><img id="decPreview" alt="解码后的图片预览"></div>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const EXT = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp", "image/gif": "gif", "image/svg+xml": "svg", "image/bmp": "bmp", "image/x-icon": "ico", "image/avif": "avif" };
$("drop").innerHTML = TB.svg(TB.I.image) + "<div><b>点击选择图片</b>、拖到这里，或 Ctrl+V 粘贴截图</div><div class='small'>支持多张同时处理</div>";
$("decDl").innerHTML = TB.svg(TB.I.download) + "<span>下载图片</span>";

const tab = TB.seg($("tab"), v => { $("enc").hidden = v !== "enc"; $("dec").hidden = v !== "dec"; }, "img:tab");
$("enc").hidden = tab.value !== "enc"; $("dec").hidden = tab.value !== "dec";
["fmt", "q", "maxW"].forEach(id => TB.persist($(id), "img:" + id));

/* ---------- 编码 ---------- */
const files = []; // { id, file, el, dataUrl, w, h, outW, outH, form, error, busy }
let uid = 0;
const readAsDataURL = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(blob); });
const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("无法解码图片")); i.src = src; });
const mimeOf = url => url.slice(5, url.indexOf(";"));

function syncOpts() {
  const f = $("fmt").value, lossy = f === "image/jpeg" || f === "image/webp";
  $("q").disabled = !lossy; // 质量只对有损格式生效
  $("q").closest(".field").style.opacity = lossy ? "" : ".5";
  $("fmtTip").textContent = f === "orig" ? "保持原格式时直接编码原文件，SVG、GIF 动图都原样保留；设置最大宽度后才会重新编码。"
    : f === "image/png" ? "PNG 无损，适合图标和截图；照片转 PNG 体积可能变大。"
    : f === "image/jpeg" ? "JPEG 适合照片，不支持透明，透明区域会填充白色。" : "WebP 体积通常最小，支持透明，现代浏览器均可显示。";
}

async function encode(e) {
  const { file } = e, fmt = $("fmt").value, maxW = Math.round(+$("maxW").value) || 0;
  const orig = await readAsDataURL(file);
  const img = await loadImg(orig).catch(() => null);
  e.w = img ? img.naturalWidth : 0; e.h = img ? img.naturalHeight : 0;
  if (fmt === "orig" && !(maxW && img && img.naturalWidth > maxW)) { e.dataUrl = orig; e.outW = e.w; e.outH = e.h; return; }
  if (!img) throw new Error("浏览器无法解码这张图片，只能保持原格式");
  const scale = maxW && img.naturalWidth > maxW ? maxW / img.naturalWidth : 1;
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(img.naturalWidth * scale)); cv.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = cv.getContext("2d");
  const type = fmt === "orig" ? (["image/png", "image/jpeg", "image/webp"].includes(file.type) ? file.type : "image/png") : fmt;
  if (type === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height); }
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  e.dataUrl = cv.toDataURL(type, Math.min(1, Math.max(0.1, (+$("q").value || 85) / 100)));
  e.outW = cv.width; e.outH = cv.height;
}

const FORMS = {
  "Data URI": e => e.dataUrl,
  "纯 Base64": e => e.dataUrl.slice(e.dataUrl.indexOf(",") + 1),
  "CSS": e => `background-image: url("${e.dataUrl}");`,
  "HTML": e => `<img src="${e.dataUrl}" width="${e.outW}" height="${e.outH}" alt="">`,
  "Markdown": e => `![image](${e.dataUrl})`,
};
const PREVIEW_MAX = 200000;

// 只更新这一张图片的卡片，不重绘整个列表
function renderItem(e) {
  const name = `<div class="name">${TB.esc(e.file.name)}</div>`;
  if (e.error) { e.el.innerHTML = `<div>${name}<div class="status err">${TB.svg(TB.I.alert)}<span>${TB.esc(e.error)}</span></div><div class="row"><button class="btn btn-sm" data-act="rm" type="button">移除</button></div></div>`; e.el.className = "card"; return; }
  if (e.busy || !e.dataUrl) { e.el.className = "card"; e.el.innerHTML = `<div class="row"><span class="spin" aria-hidden="true"></span><span class="muted">正在处理 ${TB.esc(e.file.name)}…</span></div>`; return; }
  const b64len = e.dataUrl.length - e.dataUrl.indexOf(",") - 1, ratio = b64len / e.file.size;
  const text = FORMS[e.form](e);
  e.el.className = "card item";
  e.el.innerHTML = `
    <div class="thumb checker"><img src="${e.dataUrl}" alt="${TB.esc(e.file.name)} 预览"></div>
    <div style="min-width:0">
      ${name}
      <div class="meta small muted">${e.w}×${e.h}${e.outW !== e.w ? ` → ${e.outW}×${e.outH}` : ""} · ${mimeOf(e.dataUrl)} · 原文件 ${TB.fmtSize(e.file.size)} → Base64 <b class="${ratio > 1.2 ? "up" : ""}">${TB.fmtSize(b64len)}</b></div>
      ${e.dataUrl.length > 2e6 ? '<div class="note warn" style="margin-bottom:10px">编码结果超过 2MB，嵌入网页会明显拖慢加载，建议压缩、限宽，或改用文件链接。</div>' : ""}
      <div class="seg" role="group" aria-label="输出写法">${Object.keys(FORMS).map(k => `<button type="button" data-form="${k}" aria-pressed="${k === e.form}">${k}</button>`).join("")}</div>
      <textarea class="mono" readonly aria-label="编码结果" style="margin-top:10px">${TB.esc(text.length > PREVIEW_MAX ? text.slice(0, PREVIEW_MAX) + "…（仅预览前 20 万字符，复制可获得完整内容）" : text)}</textarea>
      <div class="row">
        <button class="btn btn-sm btn-primary" data-act="copy" type="button">${TB.svg(TB.I.copy)}<span>复制</span></button>
        <button class="btn btn-sm" data-act="dl" type="button">${TB.svg(TB.I.download)}<span>下载图片</span></button>
        <button class="btn btn-sm btn-ghost" data-act="rm" type="button">${TB.svg(TB.I.trash)}<span>移除</span></button>
      </div>
    </div>`;
}
async function process(e) {
  e.busy = true; e.error = null; renderItem(e);
  try { await encode(e); } catch (err) { e.error = err.message; }
  e.busy = false; renderItem(e);
}
function addFiles(list) {
  const imgs = list.filter(f => f.type.startsWith("image/"));
  if (!imgs.length) return TB.toast("请选择图片文件", "err");
  if (tab.value !== "enc") tab.set("enc");
  for (const f of imgs) {
    const file = f.name && !/^image\.\w+$/.test(f.name) ? f : new File([f], `粘贴图片-${new Date().toTimeString().slice(0, 8).replace(/:/g, "")}.${EXT[f.type] || "png"}`, { type: f.type });
    const e = { id: ++uid, file, form: "Data URI", el: document.createElement("section") };
    e.el.dataset.id = e.id; files.push(e); $("list").appendChild(e.el); process(e);
  }
  $("clearAll").hidden = false;
}
const reencodeAll = TB.debounce(() => files.forEach(e => process(e)), 300);
["fmt", "q", "maxW"].forEach(id => $(id).addEventListener("input", () => { syncOpts(); if (files.length) reencodeAll(); }));
TB.fileDrop($("drop"), $("file"), addFiles, { paste: () => tab.value === "enc" });
$("clearAll").onclick = () => { files.length = 0; $("list").innerHTML = ""; $("clearAll").hidden = true; };

$("list").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const el = b.closest("[data-id]"), e = files.find(x => x.id === +el.dataset.id); if (!e) return;
  if (b.dataset.form) { e.form = b.dataset.form; renderItem(e); }
  else if (b.dataset.act === "copy") TB.copy(FORMS[e.form](e), `已复制 ${e.form}`);
  else if (b.dataset.act === "dl") TB.download(dataUrlToBlob(e.dataUrl), e.file.name.replace(/\.[^.]+$/, "") + "." + (EXT[mimeOf(e.dataUrl)] || "img"));
  else if (b.dataset.act === "rm") { files.splice(files.indexOf(e), 1); el.remove(); $("clearAll").hidden = !files.length; }
});
function dataUrlToBlob(url) {
  const bin = atob(url.slice(url.indexOf(",") + 1));
  return new Blob([Uint8Array.from(bin, c => c.charCodeAt(0))], { type: mimeOf(url) });
}

/* ---------- 解码 ---------- */
function sniff(b64) {
  const h = atob(b64.slice(0, 24));
  if (h.startsWith("\x89PNG")) return "image/png";
  if (h.startsWith("\xff\xd8")) return "image/jpeg";
  if (h.startsWith("GIF8")) return "image/gif";
  if (h.startsWith("RIFF") && h.slice(8, 12) === "WEBP") return "image/webp";
  if (h.startsWith("BM")) return "image/bmp";
  if (h.startsWith("\0\0\1\0")) return "image/x-icon";
  if (/^\s*<(\?xml|svg)/i.test(h)) return "image/svg+xml";
  return "image/png";
}
let decUrl = "";
function decStatus(cls, msg) { $("decInfo").className = "status " + cls; $("decInfo").innerHTML = msg ? TB.svg(cls === "err" ? TB.I.alert : TB.I.check) + `<span>${TB.esc(msg)}</span>` : ""; }
function decode() {
  let s = $("decIn").value.trim().replace(/^url\(["']?|["']?\)$/g, "");
  const img = $("decPreview");
  $("decWrap").hidden = true; $("decDl").disabled = true;
  if (!s) return decStatus("", "");
  try {
    let mime;
    const m = /^data:([^;,]+)?(;[^,]*)?,/.exec(s);
    if (m) { mime = m[1] || "image/png"; s = s.slice(m[0].length); }
    s = s.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/").replace(/=+$/, "");
    if (!/^[A-Za-z0-9+/]*$/.test(s)) throw new Error("包含非 Base64 字符");
    s += "=".repeat((4 - s.length % 4) % 4);
    mime = mime || sniff(s);
    decUrl = `data:${mime};base64,${s}`;
    img.onload = () => {
      const bytes = Math.floor(s.length * 3 / 4) - (s.match(/=+$/)?.[0].length || 0);
      decStatus("ok", `${img.naturalWidth}×${img.naturalHeight} · ${mime} · ${TB.fmtSize(bytes)}`);
      $("decWrap").hidden = false; $("decDl").disabled = false;
    };
    img.onerror = () => decStatus("err", "无法解码为图片，请检查内容是否完整");
    img.src = decUrl;
  } catch (e) { decStatus("err", e.message); }
}
$("decIn").addEventListener("input", TB.debounce(decode, 250));
$("decDl").onclick = () => TB.download(dataUrlToBlob(decUrl), "image." + (EXT[mimeOf(decUrl)] || "png"));
syncOpts();
</script>
</body>
</html>
