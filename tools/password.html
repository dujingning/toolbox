<style>
/* @shared-css:start */
/* 工具集公共样式。修改后运行 python3 scripts/sync_shared.py 同步到所有页面 */
:root {
  --bg:#f6f7f9; --surface:#fff; --surface-2:#f2f4f7; --text:#161b26; --muted:#667085;
  --border:#e4e7ec; --border-strong:#d0d5dd;

  --border:#262c37; --border-strong:#363d4a;
  --accent:#3b6fe0; --accent-hover:#5283ee; --accent-soft:rgba(91,141,239,.16); --link:#82a8f7; --on-accent:#fff;

.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:36px; padding:0 14px; border-radius:8px;

.btn-icon { width:36px; padding:0; }

.btn:disabled { opacity:.45; cursor:not-allowed; transform:none; }

.status .ic { width:15px; height:15px; }
.status.ok { color:var(--ok); } .status.err { color:var(--err); } .status.warn { color:var(--warn); }
.note { font-size:13px; padding:8px 12px; border-radius:8px; background:var(--surface-2); color:var(--muted); }
.note.warn { background:var(--warn-soft); color:var(--warn); } .note.err { background:var(--err-soft); color:var(--err); }

.kv td.v { font-family:var(--mono); font-size:13px; word-break:break-all; }

.kv tr.hit td.k { color:var(--ok); font-weight:600; }

.drop { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:28px 16px; text-align:center;
  border:1.5px dashed var(--border-strong); border-radius:var(--radius); color:var(--muted); cursor:pointer; background:var(--surface); transition:.15s; }
.drop:hover, .drop.over { border-color:var(--accent); color:var(--link); background:var(--accent-soft); }
.drop .ic { width:28px; height:28px; }
.drop b { color:var(--text); font-weight:600; }
.checker { background-color:var(--surface-2); background-image:repeating-conic-gradient(rgba(128,128,128,.16) 0 25%, transparent 0 50%); background-size:16px 16px; }
.kbd { font-family:var(--mono); font-size:12px; padding:1px 6px; border:1px solid var(--border-strong); border-bottom-width:2px; border-radius:5px; color:var(--muted); }

/* 轻提示 */
.toast-wrap { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; width:max-content; max-width:calc(100vw - 32px); }
.toast { display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:10px; background:#111827; color:#fff; font-size:14px; box-shadow:var(--shadow-lg); animation:tb-in .18s ease-out; transition:opacity .2s, transform .2s; }
.toast .ic { width:16px; height:16px; color:#4ade80; }
.toast.err .ic { color:#f87171; }
.toast.out { opacity:0; transform:translateY(6px); }
@keyframes tb-in { from { opacity:0; transform:translateY(8px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
/* @shared-css:end */
.container { max-width:760px; }
.pw-box { display:flex; align-items:center; gap:8px; padding:14px 14px 14px 18px; border:1px solid var(--border-strong); border-radius:12px; background:var(--surface-2); }

.meter { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px; }
.meter i { height:6px; border-radius:3px; background:var(--border); transition:background .2s; }
.strength { display:flex; justify-content:space-between; margin-top:6px; font-size:13px; }
.len { display:grid; grid-template-columns:1fr 76px; gap:12px; align-items:center; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { position:relative; }
.chip input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.chip > span { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; border:1px solid var(--border-strong); font-size:14px; color:var(--muted); background:var(--surface); transition:.15s; }
.chip > span .mono { font-size:12px; opacity:.8; }
.chip input:checked + span { border-color:var(--accent); color:var(--link); background:var(--accent-soft); font-weight:500; }
.chip input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.list { list-style:none; margin:0; padding:0; }
.list li { display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--border); }
.list li:first-child { border-top:0; }
.list .v { flex:1; font:14px var(--mono); word-break:break-all; }
</style>
<script>

    auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  };
  const TOOLS = [
    { id: "qrcode", name: "文本转二维码", short: "二维码", icon: I.qrcode, desc: "支持中文与 emoji，可调纠错、尺寸与颜色，导出 PNG / SVG", keys: "二维码 qr qrcode 文本 链接 生成" },

  let wrap;
  function toast(msg, type = "ok", ms = 1800) {
    if (!wrap) {

  async function copy(text, label = "已复制到剪贴板") {
    if (text == null || text === "") { toast("没有可复制的内容", "err"); return false; }
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;top:0;opacity:0";
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); ta.remove();
      if (!ok) { toast("复制失败，请手动选择后复制", "err"); return false; }
    }
    toast(label); return true;
  }
  function download(data, name, type) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: type || "application/octet-stream" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  }
  // 输入内容自动保存在本机浏览器，刷新不丢
  function persist(el, key) {
    const v = store.get(key);
    if (v !== undefined) { if (el.type === "checkbox") el.checked = v; else el.value = v; }
    const save = debounce(() => store.set(key, el.type === "checkbox" ? el.checked : el.value), 300);
    el.addEventListener("input", save); el.addEventListener("change", save);
  }
  // 分段选择控件：<div class="seg" data-value="默认"><button data-v="a">…</button></div>
  function seg(el, onChange, key) {
    const btns = [...el.querySelectorAll("button[data-v]")];
    const api = {
      value: null,
      set(v, silent) {
        if (!btns.some(b => b.dataset.v === v)) v = btns[0].dataset.v;
        api.value = v;
        btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
        if (key) store.set(key, v);
        if (!silent && onChange) onChange(v);
      },
    };
    btns.forEach(b => { b.type = "button"; b.addEventListener("click", () => api.set(b.dataset.v)); });
    api.set(key ? store.get(key, el.dataset.value) : el.dataset.value, true);
    return api;
  }
  // 拖放 / 点击 / 粘贴 选择文件
  function fileDrop(el, input, onFiles, { paste = true } = {}) {
    el.addEventListener("click", () => input.click());
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });
    input.addEventListener("change", () => { if (input.files.length) onFiles([...input.files]); input.value = ""; });
    ["dragenter", "dragover"].forEach(t => el.addEventListener(t, e => { e.preventDefault(); el.classList.add("over"); }));
    ["dragleave", "drop"].forEach(t => el.addEventListener(t, () => el.classList.remove("over")));
    el.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) onFiles([...e.dataTransfer.files]); });
    if (paste) document.addEventListener("paste", e => {
      if (typeof paste === "function" && !paste()) return;
      const fs = [...(e.clipboardData?.items || [])].filter(i => i.kind === "file").map(i => i.getAsFile()).filter(Boolean);
      if (fs.length) { e.preventDefault(); onFiles(fs); }
    });
  }

  const THEMES = { auto: ["跟随系统", I.auto], light: ["浅色", I.sun], dark: ["深色", I.moon] };
  function buildHeader() {
    const h = document.getElementById("tb-header"); if (!h) return;
    const cur = root.dataset.tool, base = root.dataset.root || "";
    const nav = cur
      ? `<nav class="toolnav" aria-label="切换工具">${TOOLS.map(t => `<a href="${base}${t.href}"${t.id === cur ? ' aria-current="page"' : ""}>${svg(t.icon)}<span>${t.short}</span></a>`).join("")}</nav>`
      : '<div class="spacer"></div>';
    h.innerHTML = `<a class="brand" href="${base}index.html" aria-label="返回工具集首页"><span class="logo">${svg(I.box)}</span><span class="brand-text">工具集</span></a>${nav}<button class="btn btn-ghost btn-icon" id="tb-theme" type="button"></button>`;
    const btn = h.querySelector("#tb-theme");
    const paint = () => { const m = store.get("theme", "auto"), [n, ic] = THEMES[m] || THEMES.auto; btn.innerHTML = svg(ic); btn.title = btn.ariaLabel = `主题：${n}（点击切换）`; };
    btn.onclick = () => { const order = ["auto", "light", "dark"], m = order[(order.indexOf(store.get("theme", "auto")) + 1) % 3]; store.set("theme", m); applyTheme(m); paint(); toast("主题：" + THEMES[m][0]); };
    paint();
    const a = h.querySelector("[aria-current]"), n = h.querySelector(".toolnav");
    if (a && n) n.scrollLeft = a.offsetLeft - n.clientWidth / 2 + a.offsetWidth / 2;
  }
  function favicon() {
    const t = TOOLS.find(x => x.id === root.dataset.tool), p = t ? t.icon : I.box;
    const s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#2563eb"/><g transform="translate(5 5) scale(.917)" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${p.replace(/currentColor/g, "#fff")}</g></svg>`;
    const l = document.createElement("link"); l.rel = "icon"; l.href = "data:image/svg+xml," + encodeURIComponent(s); document.head.appendChild(l);
  }
  favicon();
  document.addEventListener("DOMContentLoaded", () => {
    buildHeader();
    const af = document.querySelector("[data-autofocus]");
    if (af && isDesktop()) af.focus({ preventScroll: true }); // 手机上不自动弹出键盘
  });

  return { TOOLS, I, svg, esc, debounce, isDesktop, isNarrow, fmtSize, store, toast, copy, download, persist, seg, fileDrop };
})();
/* @shared-js:end */
</script>
</head>
<body>
<header id="tb-header" class="topbar"></header>
<main class="container">
  <div class="page-head">
    <h1>随机密码</h1>
    <p>使用浏览器的加密安全随机数生成，密码不会被记录或上传。点击密码即可复制。</p>
  </div>

  <section class="card">
    <div class="pw-box">
      <div id="pw" title="点击复制" role="button" tabindex="0" aria-label="生成的密码，点击复制"></div>
      <button class="btn btn-icon" id="regen" type="button" title="重新生成" aria-label="重新生成"></button>
      <button class="btn btn-primary" id="copy" type="button"></button>
    </div>
    <div class="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="strength"><span id="sLabel"></span><span class="muted" id="sBits"></span></div>
  </section>

  <section class="card stack">
    <div class="field">
      <label class="label" for="lenRange">长度</label>
      <div class="len"><input type="range" id="lenRange" min="4" max="64" value="16" aria-label="长度滑块"><input type="number" id="len" min="4" max="128" value="16" aria-label="长度"></div>
    </div>
    <div class="field">
      <span class="label">字符类型</span>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="cU" checked><span>大写 <span class="mono">A-Z</span></span></label>
        <label class="chip"><input type="checkbox" id="cL" checked><span>小写 <span class="mono">a-z</span></span></label>
        <label class="chip"><input type="checkbox" id="cD" checked><span>数字 <span class="mono">0-9</span></span></label>
        <label class="chip"><input type="checkbox" id="cS" checked><span>符号 <span class="mono">!@#$</span></span></label>
        <label class="chip"><input type="checkbox" id="cX"><span>排除易混淆 <span class="mono">0O1lI</span></span></label>
      </div>
    </div>
    <div class="field">
      <span class="label">数量</span>
      <div><div class="seg" id="count" data-value="1" role="group" aria-label="生成数量"><button data-v="1">1 个</button><button data-v="5">5 个</button><button data-v="10">10 个</button><button data-v="20">20 个</button></div></div>
    </div>
  </section>

  <section class="card" id="batch" hidden>
    <div class="card-head"><h2>批量结果</h2><button class="btn btn-sm" id="copyAll" type="button"></button></div>
    <ul class="list" id="list"></ul>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const SETS = { cU: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", cL: "abcdefghijklmnopqrstuvwxyz", cD: "0123456789", cS: "!@#$%^&*()-_=+[]{};:,.<>?/~" };
$("regen").innerHTML = TB.svg(TB.I.refresh);
$("copy").innerHTML = TB.svg(TB.I.copy) + "<span>复制</span>";
$("copyAll").innerHTML = TB.svg(TB.I.copy) + "<span>复制全部</span>";
["len", "cU", "cL", "cD", "cS", "cX"].forEach(id => TB.persist($(id), "pw:" + id));
$("lenRange").value = Math.min(64, $("len").value);
const count = TB.seg($("count"), gen, "pw:count");

// 拒绝采样，避免取模偏差
const randInt = n => { const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1); do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; };
function make(len, groups) {
  const all = groups.join(""), chars = groups.map(g => g[randInt(g.length)]); // 每类至少一个
  while (chars.length < len) chars.push(all[randInt(all.length)]);
  for (let i = chars.length - 1; i > 0; i--) { const j = randInt(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
  return chars.join("");
}
let list = [];
function gen() {
  const len = Math.max(4, Math.min(128, Math.round(+$("len").value) || 16));
  const strip = s => $("cX").checked ? s.replace(/[0O1lI]/g, "") : s;
  const groups = Object.keys(SETS).filter(k => $(k).checked).map(k => strip(SETS[k]));
  if (!groups.length) {
    $("pw").textContent = "请至少选择一种字符"; $("pw").style.color = "var(--err)"; list = [];
    $("batch").hidden = true; paintMeter(0); return;
  }
  $("pw").style.color = "";
  list = Array.from({ length: +count.value }, () => make(len, groups));
  $("pw").textContent = list[0];
  $("batch").hidden = list.length < 2;
  $("list").innerHTML = list.map((p, i) => `<li><span class="v">${TB.esc(p)}</span><button class="btn btn-sm btn-ghost btn-icon" data-i="${i}" aria-label="复制第 ${i + 1} 个">${TB.svg(TB.I.copy)}</button></li>`).join("");
  paintMeter(len * Math.log2(groups.join("").length));
}
function paintMeter(bits) {
  const lv = bits === 0 ? 0 : bits < 40 ? 1 : bits < 60 ? 2 : bits < 80 ? 3 : 4;
  const [label, color] = [["", ""], ["弱", "var(--err)"], ["一般", "var(--warn)"], ["强", "var(--ok)"], ["很强", "var(--ok)"]][lv];
  document.querySelectorAll(".meter i").forEach((el, i) => el.style.background = i < lv ? color : "");
  $("sLabel").textContent = label ? "强度：" + label : ""; $("sLabel").style.color = color;
  $("sBits").textContent = bits ? `约 ${Math.round(bits)} 位熵` : "";
}
$("lenRange").addEventListener("input", () => { $("len").value = $("lenRange").value; $("len").dispatchEvent(new Event("change")); gen(); });
$("len").addEventListener("input", () => { $("lenRange").value = Math.min(64, +$("len").value || 4); gen(); });
["cU", "cL", "cD", "cS", "cX"].forEach(id => $(id).addEventListener("change", gen));
const copyPw = () => list[0] && TB.copy(list[0], "密码已复制");
$("copy").onclick = copyPw; $("pw").onclick = copyPw;
$("pw").onkeydown = e => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), copyPw());
$("regen").onclick = gen;
$("copyAll").onclick = () => TB.copy(list.join("\n"), `已复制 ${list.length} 个密码`);
$("list").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) TB.copy(list[b.dataset.i], "密码已复制"); });
gen();
</script>
</body>
</html>
