<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本转二维码</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2430; --muted:#6b7280; --border:#d9dde3; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2026; --text:#e6e8ec; --muted:#9aa1ad; --border:#33373f; --accent:#5b8def; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:880px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:720px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  textarea { width:100%; height:180px; resize:vertical; padding:10px; border:1px solid var(--border); border-radius:8px;
             background:transparent; color:inherit; font:inherit; }
  textarea:focus, select:focus, input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .row { display:flex; flex-wrap:wrap; gap:12px 16px; margin-top:12px; align-items:center; }
  label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:14px; }
  select, input[type=number] { padding:5px 8px; border:1px solid var(--border); border-radius:6px; background:transparent; color:var(--text); font:inherit; }
  input[type=number] { width:80px; }
  input[type=color] { width:34px; height:28px; padding:0; border:1px solid var(--border); border-radius:6px; background:none; }
  button { padding:8px 14px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .out { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .preview { display:flex; align-items:center; justify-content:center; min-height:260px; width:100%;
             background:repeating-conic-gradient(#0000000d 0 25%, transparent 0 50%) 0 0/16px 16px; border-radius:8px; overflow:auto; }
  canvas { max-width:100%; height:auto; image-rendering:pixelated; }
  .info { color:var(--muted); font-size:13px; min-height:20px; text-align:center; }
  .err { color:#dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <p><a href="../index.html" style="color:var(--accent);text-decoration:none">← 返回工具集</a></p>
  <h1>文本转二维码</h1>
  <div class="grid">
    <div class="card">
      <textarea id="text" placeholder="输入文本或链接…（支持中文、emoji）" autofocus></textarea>
      <div class="row">
        <label>纠错级别
          <select id="ecc">
            <option value="0">L (7%)</option>
            <option value="1" selected>M (15%)</option>
            <option value="2">Q (25%)</option>
            <option value="3">H (30%)</option>
          </select>
        </label>
        <label>像素尺寸 <input type="number" id="size" value="320" min="64" max="2048" step="16"></label>
        <label>边距(格) <input type="number" id="margin" value="2" min="0" max="20"></label>
      </div>
      <div class="row">
        <label>前景 <input type="color" id="fg" value="#000000"></label>
        <label>背景 <input type="color" id="bg" value="#ffffff"></label>
      </div>
    </div>
    <div class="card out">
      <div class="preview"><canvas id="cv" width="0" height="0"></canvas></div>
      <div class="info" id="info"></div>
      <div class="row" style="margin:0">
        <button class="primary" id="dlPng" disabled>下载 PNG</button>
        <button id="dlSvg" disabled>下载 SVG</button>
        <button id="copy" disabled>复制图片</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== QR 编码器（字节模式，版本 1-40，自动选版本与掩码；纯本地无依赖） ===== */
const QR = (() => {
  const ECC_PER_BLOCK = [
    [-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28],
    [-1,13,22,18,26,18,24,18,22,20,24,28,26,24,20,30,24,28,28,26,30,28,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
    [-1,17,28,22,16,22,28,26,26,24,28,24,28,22,24,24,30,28,28,26,28,30,24,30,30,30,30,28,30,30,30,30,30,30,30,30,30,30,30,30,30]];
  const NUM_BLOCKS = [
    [-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
    [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49],
    [-1,1,1,2,2,4,4,6,6,8,8,8,10,12,16,12,17,16,18,21,20,23,23,25,27,29,34,34,35,38,40,43,45,48,51,53,56,59,62,65,68],
    [-1,1,1,2,4,4,4,5,6,8,8,11,11,16,16,18,16,19,21,25,25,25,34,30,32,35,37,40,42,45,48,51,54,57,60,63,66,70,74,77,81]];
  const FORMAT_BITS = [1, 0, 3, 2]; // L M Q H

  const rawModules = v => {
    let r = (16 * v + 128) * v + 64;
    if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; }
    return r;
  };
  const dataCodewords = (v, e) => Math.floor(rawModules(v) / 8) - ECC_PER_BLOCK[e][v] * NUM_BLOCKS[e][v];

  const gfMul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; };
  const rsDivisor = deg => {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) {
      for (let j = 0; j < deg; j++) { r[j] = gfMul(r[j], root); if (j + 1 < deg) r[j] ^= r[j + 1]; }
      root = gfMul(root, 2);
    }
    return r;
  };
  const rsRemainder = (data, div) => {
    const r = new Array(div.length).fill(0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => r[i] ^= gfMul(c, f)); }
    return r;
  };

  function encode(bytes, ecl) {
    // 选择最小版本
    let ver = 1;
    for (;; ver++) {
      if (ver > 40) throw new Error("文本过长，超出二维码容量");
      const ccBits = ver <= 9 ? 8 : 16;
      if (bytes.length < (1 << ccBits) && 4 + ccBits + bytes.length * 8 <= dataCodewords(ver, ecl) * 8) break;
    }
    // 位流
    const bits = [];
    const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    put(4, 4); put(bytes.length, ver <= 9 ? 8 : 16);
    bytes.forEach(b => put(b, 8));
    const cap = dataCodewords(ver, ecl) * 8;
    put(0, Math.min(4, cap - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }

    // 纠错 + 交织
    const nb = NUM_BLOCKS[ecl][ver], eccLen = ECC_PER_BLOCK[ecl][ver];
    const raw = Math.floor(rawModules(ver) / 8), nShort = nb - raw % nb, shortLen = Math.floor(raw / nb);
    const div = rsDivisor(eccLen), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const d = data.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1)); k += d.length;
      const ecc = rsRemainder(d, div);
      if (i < nShort) d.push(0);
      blocks.push(d.concat(ecc));
    }
    const all = [];
    for (let i = 0; i < blocks[0].length; i++)
      blocks.forEach((b, j) => { if (i !== shortLen - eccLen || j >= nShort) all.push(b[i]); });

    // 绘制
    const size = ver * 4 + 17;
    const m = Array.from({ length: size }, () => new Array(size).fill(false));
    const fn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, d) => { m[y][x] = d; fn[y][x] = true; };

    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, d !== 2 && d !== 4);
      }
    };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    if (ver > 1) {
      const n = Math.floor(ver / 7) + 2;
      const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
      const pos = [6]; for (let p = size - 7; pos.length < n; p -= step) pos.splice(1, 0, p);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++)
          setFn(pos[i] + dx, pos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      }
    }
    const drawFormat = mask => {
      const d = (FORMAT_BITS[ecl] << 3) | mask; let r = d;
      for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const b = ((d << 10) | r) ^ 0x5412, bit = i => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(i));
      setFn(8, 7, bit(6)); setFn(8, 8, bit(7)); setFn(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let r = ver; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
      const b = (ver << 12) | r;
      for (let i = 0; i < 18; i++) {
        const d = ((b >>> i) & 1) !== 0, a = size - 11 + i % 3, c = Math.floor(i / 3);
        setFn(a, c, d); setFn(c, a, d);
      }
    }
    // 数据位
    for (let i = 0, right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, y = ((right + 1) & 2) === 0 ? size - 1 - vert : vert;
        if (!fn[y][x] && i < all.length * 8) { m[y][x] = ((all[i >>> 3] >>> (7 - (i & 7))) & 1) !== 0; i++; }
      }
    }
    // 掩码
    const applyMask = mask => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
        let inv;
        switch (mask) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inv = x * y % 2 + x * y % 3 === 0; break;
          case 6: inv = (x * y % 2 + x * y % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + x * y % 3) % 2 === 0;
        }
        if (!fn[y][x] && inv) m[y][x] = !m[y][x];
      }
    };
    const penalty = () => {
      let p = 0, dark = 0;
      const line = get => {
        let run = 1, hist = "";
        for (let i = 0; i < size; i++) {
          const c = get(i); hist += c ? "1" : "0"; if (c) dark++;
          if (i > 0 && c === get(i - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
        }
        for (const pat of ["10111010000", "00001011101"]) { let k = -1; while ((k = hist.indexOf(pat, k + 1)) >= 0) p += 40; }
      };
      for (let y = 0; y < size; y++) line(i => m[y][i]);
      dark = 0;
      for (let x = 0; x < size; x++) line(i => m[i][x]);
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++)
        if (m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
      const total = size * size;
      p += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return p;
    };
    let best = 0, bestP = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      applyMask(mask); drawFormat(mask);
      const p = penalty(); if (p < bestP) { bestP = p; best = mask; }
      applyMask(mask);
    }
    applyMask(best); drawFormat(best);
    return { modules: m, size, version: ver };
  }
  return { encode };
})();

/* ===== 界面逻辑 ===== */
const $ = id => document.getElementById(id);
const cv = $("cv"), info = $("info");
let current = null;

function render() {
  const text = $("text").value;
  const btns = ["dlPng", "dlSvg", "copy"].map($);
  if (!text) { cv.width = cv.height = 0; info.textContent = ""; info.classList.remove("err"); btns.forEach(b => b.disabled = true); current = null; return; }
  try {
    const bytes = Array.from(new TextEncoder().encode(text));
    const qr = QR.encode(bytes, +$("ecc").value);
    const margin = Math.max(0, Math.min(20, +$("margin").value || 0));
    const total = qr.size + margin * 2;
    const want = Math.max(64, Math.min(2048, +$("size").value || 320));
    const scale = Math.max(1, Math.floor(want / total));
    const px = total * scale;
    cv.width = cv.height = px;
    const g = cv.getContext("2d");
    g.fillStyle = $("bg").value; g.fillRect(0, 0, px, px);
    g.fillStyle = $("fg").value;
    qr.modules.forEach((row, y) => row.forEach((d, x) => { if (d) g.fillRect((x + margin) * scale, (y + margin) * scale, scale, scale); }));
    current = { qr, margin, total };
    info.classList.remove("err");
    info.textContent = `版本 ${qr.version} · ${qr.size}×${qr.size} 模块 · ${bytes.length} 字节 · 图片 ${px}×${px}px`;
    btns.forEach(b => b.disabled = false);
  } catch (e) {
    cv.width = cv.height = 0; current = null;
    info.classList.add("err"); info.textContent = e.message;
    btns.forEach(b => b.disabled = true);
  }
}

function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("dlPng").onclick = () => cv.toBlob(b => download(b, "qrcode.png"));
$("dlSvg").onclick = () => {
  if (!current) return;
  const { qr, margin, total } = current;
  let d = "";
  qr.modules.forEach((row, y) => row.forEach((v, x) => { if (v) d += `M${x + margin},${y + margin}h1v1h-1z`; }));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" shape-rendering="crispEdges">` +
    `<rect width="${total}" height="${total}" fill="${$("bg").value}"/><path d="${d}" fill="${$("fg").value}"/></svg>`;
  download(new Blob([svg], { type: "image/svg+xml" }), "qrcode.svg");
};
$("copy").onclick = () => cv.toBlob(async b => {
  const old = $("copy").textContent;
  try { await navigator.clipboard.write([new ClipboardItem({ "image/png": b })]); $("copy").textContent = "已复制 ✓"; }
  catch { $("copy").textContent = "复制失败（请用下载）"; }
  setTimeout(() => $("copy").textContent = old, 1500);
});

["text", "ecc", "size", "margin", "fg", "bg"].forEach(id => $(id).addEventListener("input", render));
render();
</script>
</body>
</html>
